<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)" rx="8" />
  <rect x="12" y="12" width="376" height="576" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" rx="6" />
  <circle cx="200" cy="240" r="70" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)" />
  <polygon points="190,210 230,240 190,270" fill="#38bdf8" />
  <text x="200" y="370" fill="#f1f5f9" font-family="'Outfit', sans-serif, system-ui" font-weight="700" font-size="22" text-anchor="middle" letter-spacing="2">DEBU'S SANCTUARY</text>
  <text x="200" y="405" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle" letter-spacing="1">ANIME ARCHIVE // VERIFIED</text>
  <line x1="80" y1="430" x2="320" y2="430" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
  <text x="200" y="460" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">★ MASTERPIECE COLLECTION ★</text>
</svg>
