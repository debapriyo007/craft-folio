<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bandanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="16" fill="#0c0d12"/>
  <circle cx="100" cy="85" r="75" fill="url(#goldGlow)"/>

  <!-- Gold Star Crown Indicator -->
  <path d="M85 24 L90 32 L99 32 L92 38 L95 47 L87 41 L80 47 L82 38 L76 32 L85 32 Z" fill="#fbbf24" stroke="#ca8a04" stroke-width="1"/>
  <text x="106" y="42" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fbbf24" letter-spacing="1">#1 GOAT</text>

  <!-- Shoulders & Vest -->
  <path d="M42 195 C45 155 60 142 85 138 L115 138 C140 142 155 155 158 195 Z" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Chest / Neck -->
  <path d="M82 110 L82 145 C82 155 118 155 118 145 L118 110 Z" fill="#8d5b40"/>
  
  <!-- Gold Medallion Chain -->
  <path d="M78 135 C88 175 112 175 122 135" fill="none" stroke="url(#chainGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="165" r="9" fill="url(#chainGrad)" stroke="#78350f" stroke-width="1.5"/>
  <text x="100" y="168" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">2P</text>

  <!-- Head / Face -->
  <ellipse cx="100" cy="98" rx="34" ry="40" fill="#a0684b"/>
  <!-- Jaw contour -->
  <path d="M72 90 C72 126 82 136 100 136 C118 136 128 126 128 90 Z" fill="#8d5b40"/>

  <!-- Eyes with intense expression -->
  <ellipse cx="88" cy="95" rx="5" ry="3.5" fill="#18181b"/>
  <circle cx="89" cy="94" r="1.2" fill="#fff"/>
  <ellipse cx="112" cy="95" rx="5" ry="3.5" fill="#18181b"/>
  <circle cx="113" cy="94" r="1.2" fill="#fff"/>
  
  <!-- Eyebrows -->
  <path d="M80 88 C85 86 93 88 95 90" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M120 88 C115 86 107 88 105 90" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M99 94 L97 108 L103 108" fill="none" stroke="#6d432d" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose ring (iconic 2Pac stud/ring) -->
  <circle cx="104" cy="107" r="1.5" fill="#fef08a"/>

  <!-- Mustache & Goatee -->
  <path d="M90 114 C95 112 105 112 110 114" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="100" cy="126" rx="4" ry="5" fill="#18181b"/>

  <!-- Lips -->
  <path d="M92 118 C96 121 104 121 108 118" fill="none" stroke="#6d432d" stroke-width="2" stroke-linecap="round"/>

  <!-- Iconic Tied Forward Bandana -->
  <path d="M66 84 C66 60 76 56 100 56 C124 56 134 60 134 84 C134 88 130 90 126 90 C120 84 80 84 74 90 C70 90 66 88 66 84 Z" fill="url(#bandanaGrad)" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M72 82 Q100 76 128 82" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Bandana Front Knot & Rabbit Ears -->
  <ellipse cx="100" cy="74" rx="7" ry="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <!-- Left knot tip -->
  <path d="M96 74 C90 64 82 66 84 75 C86 80 94 77 96 75 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <!-- Right knot tip -->
  <path d="M104 74 C110 64 118 66 116 75 C114 80 106 77 104 75 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>

  <!-- Subtle Paisley Dots on Bandana -->
  <circle cx="85" cy="72" r="1" fill="#374151"/>
  <circle cx="115" cy="72" r="1" fill="#374151"/>
  <circle cx="100" cy="62" r="1" fill="#374151"/>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="196" height="196" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
</svg>
