<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Debapriya Das — Software Developer & CS Student</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Debapriya Das — Computer Science Student & Full Stack Software Developer specializing in Java, Spring Boot, TypeScript, and modern Web Applications."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Performance Preconnects for Zone Media & Spotify Engine -->
    <link rel="preconnect" href="https://cdn.myanimelist.net" />
    <link rel="dns-prefetch" href="https://cdn.myanimelist.net" />
    <link rel="preconnect" href="https://open.spotify.com" />
    <link rel="dns-prefetch" href="https://open.spotify.com" />

    <!-- Google Fonts: Pixelify Sans, Silkscreen, Space Grotesk, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Pixelify+Sans:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FOUC prevention for light/dark theme -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
