<aside class="about-glass-card" aria-label="About Debapriya">
  <div class="card-header">
    <div class="header-indicator"></div>
    <h2 class="card-title">PLAYER ATTRIBUTES</h2>
  </div>

  <p class="about-text">
    {{ profile().about }}
  </p>

  <div class="card-divider"></div>

  <ul class="about-meta-list">
    <li class="meta-row">
      <div class="meta-icon-bubble" aria-hidden="true">
        <svg
          class="meta-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <div class="meta-info">
        <span class="meta-label">SPAWN POINT</span>
        <span class="meta-val">{{ profile().location }}</span>
      </div>
    </li>

    <li class="meta-row">
      <div class="meta-icon-bubble" aria-hidden="true">
        <svg
          class="meta-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div class="meta-info">
        <span class="meta-label">ACADEMY GUILD</span>
        <span class="meta-val">{{ profile().educationShort }}</span>
      </div>
    </li>

    <li class="meta-row">
      <div class="meta-icon-bubble" aria-hidden="true">
        <svg class="meta-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
      </div>
      <div class="meta-info">
        <span class="meta-label">CODE VAULT</span>
        <a [href]="profile().githubUrl" target="_blank" rel="noopener noreferrer" class="meta-link">
          {{ profile().githubUsername }}
          <svg
            class="link-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>
      </div>
    </li>

    <li class="meta-row">
      <div class="meta-icon-bubble" aria-hidden="true">
        <svg
          class="meta-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
        </svg>
      </div>
      <div class="meta-info">
        <span class="meta-label">LIVE SERVER</span>
        <a
          [href]="profile().websiteUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="meta-link"
        >
          {{ profile().website }}
          <svg
            class="link-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>
      </div>
    </li>
  </ul>
</aside>
