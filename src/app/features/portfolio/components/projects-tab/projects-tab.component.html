<div class="tab-panel" id="tab-panel-projects" role="tabpanel" aria-labelledby="tab-btn-projects">
  <div class="section-header">
    <div class="header-indicator"></div>
    <div>
      <h2 class="section-title">Featured Projects & Builds</h2>
      <p class="projects-intro">
        Full stack web applications, Java enterprise systems, and developer tools.
      </p>
    </div>
  </div>

  <div class="project-grid">
    @for (project of visibleProjects(); track project.id) {
      <article class="project-glass-card">
        <div class="banner-wrapper">
          <img
            [src]="project.thumbnail"
            [alt]="project.title"
            class="banner-image"
            width="334"
            height="180"
            loading="lazy"
          />
          <div class="banner-overlay"></div>
          <span class="category-pill">{{ project.category }}</span>
        </div>

        <div class="card-body">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>
        </div>

        <div class="card-footer">
          <a
            [href]="project.liveUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn primary"
          >
            <span>Live Demo</span>
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>

          <a
            [href]="project.githubUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn secondary"
          >
            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </article>
    }
  </div>

  @if (hasMore()) {
    <div class="load-more-wrapper">
      <button
        class="load-more-glass-btn"
        type="button"
        (click)="loadMore()"
        aria-label="Load more projects"
      >
        <span>View More Projects</span>
        <svg
          class="chevron-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
  }
</div>
