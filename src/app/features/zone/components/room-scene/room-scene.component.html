<section class="room-scene-panel" aria-label="Interactive RPG Sanctuary Room">
  <div class="room-hud-bar">
    <div class="hud-left">
      <span class="hud-square"></span>
      <span class="hud-title">ROOM SANCTUARY // INTERACTIVE MAP</span>
    </div>
    <div class="hud-right" aria-hidden="true">
      <span class="hud-coord">X:128 Y:64 Z:256</span>
      <span class="hud-mode">[CLICK / ENTER TO ENTER MODULE]</span>
    </div>
  </div>

  <div class="room-grid" role="list">
    @for (module of modules; track module.id) {
      <div
        class="room-object-card"
        role="button"
        [tabindex]="0"
        [attr.aria-label]="module.title + ' - ' + module.description"
        (click)="selectModule(module.id, module.targetId)"
        (keydown)="onKeyDown($event, module.id, module.targetId)"
      >
        <div class="card-corner tl" aria-hidden="true"></div>
        <div class="card-corner tr" aria-hidden="true"></div>
        <div class="card-corner bl" aria-hidden="true"></div>
        <div class="card-corner br" aria-hidden="true"></div>

        <div class="module-icon-box" aria-hidden="true">
          @switch (module.icon) {
            @case ('monitor') {
              <!-- Monitor / Terminal SVG -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="pixel-icon"
              >
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
                <polyline points="7 8 10 10 7 12"></polyline>
                <line x1="12" y1="12" x2="15" y2="12"></line>
              </svg>
            }
            @case ('headphones') {
              <!-- Headphones SVG -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="pixel-icon"
              >
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                <path
                  d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
                ></path>
              </svg>
            }
            @case ('book') {
              <!-- Anime Bookshelf SVG -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="pixel-icon"
              >
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="11" x2="13" y2="11"></line>
              </svg>
            }
          }
        </div>

        <div class="module-info">
          <div class="module-badge-row">
            <span class="module-tag">{{ module.category }}</span>
            <span class="action-arrow" aria-hidden="true">↵</span>
          </div>
          <h3 class="module-title">{{ module.title }}</h3>
          <p class="module-subtitle">{{ module.description }}</p>
        </div>
      </div>
    }
  </div>
</section>
