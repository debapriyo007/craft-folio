<div class="spotify-embed-card" aria-label="Official Spotify Hip-Hop Embed Console">
  <!-- Top Bar with Status and Actions -->
  <div class="embed-top-bar">
    <div class="embed-tag">
      <span class="spotify-dot" aria-hidden="true"></span>
      <span class="embed-title">SPOTIFY AUDIO INTERFACE // HI-FI DECK</span>
      <span class="active-badge">{{ currentChannel().badge }}</span>
    </div>

    <div class="embed-controls">
      <button
        type="button"
        class="mode-toggle-btn"
        (click)="toggleViewMode()"
        [attr.aria-label]="isExpanded() ? 'Switch to compact view' : 'Switch to full view'"
      >
        <span>{{ isExpanded() ? '⊟ COMPACT' : '⊞ EXPAND' }}</span>
      </button>

      <button
        type="button"
        class="spotify-direct-btn"
        (click)="openSpotifyDirect()"
        aria-label="Open current playlist in Spotify App"
      >
        <svg
          viewBox="0 0 24 24"
          width="13"
          height="13"
          fill="currentColor"
          class="sp-icon"
          aria-hidden="true"
        >
          <path
            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"
          />
        </svg>
        <span>OPEN SPOTIFY ↗</span>
      </button>
    </div>
  </div>

  <!-- Channel Selector Tabs -->
  <div class="channel-selector-row" role="tablist" aria-label="Hip-Hop Station Channels">
    @for (ch of channels; track ch.id) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeChannelId() === ch.id"
        class="channel-tab-btn"
        [class.active]="activeChannelId() === ch.id"
        (click)="selectChannel(ch.id)"
      >
        <span class="tab-indicator" aria-hidden="true"></span>
        <span class="tab-name">{{ ch.name }}</span>
      </button>
    }
  </div>

  <!-- Channel Description Info Bar -->
  <div class="channel-info-strip">
    <div class="strip-left">
      <span class="strip-icon" aria-hidden="true">▶</span>
      <span class="strip-desc">{{ currentChannel().description }}</span>
    </div>
    <div class="strip-right" aria-hidden="true">
      <span class="audio-specs">320 KBPS • STEREO</span>
    </div>
  </div>

  <!-- Spotify Player IFrame -->
  <div class="iframe-wrapper" [class.expanded]="isExpanded()">
    @if (safeUrl(); as url) {
      <iframe
        [src]="url"
        width="100%"
        [height]="isExpanded() ? '352' : '152'"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        [title]="currentChannel().name + ' Spotify Player'"
        class="spotify-iframe"
      ></iframe>
    }
  </div>

  <!-- Direct Launch Helper -->
  <div class="embed-helper-bar">
    <div class="helper-text">
      <span class="helper-icon">ℹ</span>
      <span>If playback is paused or blocked by browser extensions, open directly:</span>
    </div>
    <button type="button" class="helper-action-btn" (click)="openSpotifyDirect()">
      LAUNCH IN SPOTIFY ↗
    </button>
  </div>
</div>
