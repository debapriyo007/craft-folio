<button
  class="theme-toggle-btn"
  type="button"
  (click)="toggle($event)"
  [attr.aria-label]="isDark ? 'Switch to Overworld Day realm' : 'Switch to Netherite Night realm'"
  [attr.aria-pressed]="isDark"
>
  <div class="icon-slot">
    <svg
      class="theme-icon sun"
      [class.active]="isDark"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.41 1.41"></path>
      <path d="m17.66 17.66 1.41 1.41"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m6.34 17.66-1.41 1.41"></path>
      <path d="m19.07 4.93-1.41 1.41"></path>
    </svg>
    <svg
      class="theme-icon moon"
      [class.active]="!isDark"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </div>
  <div class="theme-text-container" aria-hidden="true">
    <span class="theme-realm-label" [class.active]="isDark">DAY REALM</span>
    <span class="theme-realm-label" [class.active]="!isDark">NIGHT REALM</span>
  </div>
</button>
